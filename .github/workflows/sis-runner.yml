name: SIS Synthetic Runner

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

jobs:
  run-sis-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run SIS jobs
        env:
          SIS_API_BASE: ${{ secrets.SIS_API_BASE }}
          SIS_ADMIN_KEY: ${{ secrets.SIS_ADMIN_KEY }}
          RUNNER_CONFIG: ./config.json
          SIS_JOB_LIMIT: "5"
        run: node run-sis-jobs.js
