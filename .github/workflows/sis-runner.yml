name: SIS Synthetic Runner

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

jobs:
  check-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      has_due_jobs: ${{ steps.check.outputs.has_due_jobs }}
    steps:
      - name: Check for due jobs
        id: check
        run: |
          RESPONSE=$(curl -sf "${{ secrets.SIS_API_BASE }}/api/synth/status" || echo '{"has_due_jobs":false}')
          HAS_JOBS=$(echo "$RESPONSE" | jq -r '.has_due_jobs // false')
          echo "Response: $RESPONSE"
          echo "has_due_jobs=$HAS_JOBS" >> $GITHUB_OUTPUT
          if [ "$HAS_JOBS" = "true" ]; then
            echo "✅ Found due jobs - will proceed with runner"
          else
            echo "⏭️ No due jobs - skipping runner"
          fi

  run-sis-jobs:
    needs: check-jobs
    if: needs.check-jobs.outputs.has_due_jobs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: tools/traffic-runner/package-lock.json

      - name: Install dependencies
        working-directory: tools/traffic-runner
        run: npm ci

      - name: Install Playwright browsers
        working-directory: tools/traffic-runner
        run: npx playwright install --with-deps chromium

      - name: Run SIS jobs
        env:
          SIS_API_BASE: ${{ secrets.SIS_API_BASE }}
          SIS_ADMIN_KEY: ${{ secrets.SIS_ADMIN_KEY }}
          RUNNER_CONFIG: ./config.json
          SIS_JOB_LIMIT: "5"
        working-directory: tools/traffic-runner
        run: node run-sis-jobs.js
