<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="initial-scale=50, user-scalable=false">
    <script src="https://argfcu.customer-dev.cardupdatr.app/cardupdatr-client-v2.js"></script>
    <style>
        /* Button and dropdown styling */
        body {
            display: flex;
            flex-direction: column; 
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        #placeCardsButton, #characterSelect {
            background-color: #004f39;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            text-align: center;
            margin-top: 20px; 
        }
        #placeCardsButton:hover, #characterSelect:hover {
            background-color: #003d31;
        }
        #data {
            text-align: center;
            display: block;
        }
        #data pre {
            text-align: left; 
            margin: 0 auto; 
        }
        .campaign-field {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div id="data">
        <div class="campaign-field">
            <label for="campaignID">CampaignID:</label>
            <input type="text" id="campaignID" name="campaignID">
        </div>

        <div>
            <label for="characterSelect">Select Character:</label>
            <select id="characterSelect">
                <option value="jack_skellington">Jack Skellington</option>
                <option value="pepper_potts">Pepper Potts</option>
                <option value="no_card">No Card</option>
            </select>
        </div>

        <div>
            <input type="checkbox" id="excludeCVV"> Exclude CVV<br>
            <input type="checkbox" id="excludePhoneNumber"> Exclude Phone Number<br>
            <input type="checkbox" id="excludeEmail"> Exclude Email<br>
        </div>

        <button id="placeCardsButton">Place your cards!</button>
    </div>

    <div class="cardupdatr-frame" id="cardupdatr-frame" style="background-color: #004f39;"></div>

    <script>
        function getCampaignIDFromQueryString() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('campaignid');
        }

        document.addEventListener('DOMContentLoaded', function() {
            const campaignIDInput = document.getElementById('campaignID');
            const campaignID = getCampaignIDFromQueryString();
            if (campaignID) {
                campaignIDInput.value = campaignID;
            }
        });

        var ssoGrant = '';
        var ssoCardID = '';

        function callApiGateway(callback) {
            const character = document.getElementById('characterSelect').value;
            const excludeCVV = document.getElementById('excludeCVV').checked;
            const excludePhoneNumber = document.getElementById('excludePhoneNumber').checked;
            const excludeEmail = document.getElementById('excludeEmail').checked;
            const campaignID = document.getElementById('campaignID').value.trim();

            let data = {};

            if (character === 'jack_skellington') {
                data = {
                    "cardholder_data": {
                        "email": "jack_skellington@scareme.com",
                        "type": "ephemeral",
                        "custom_data": {
                            "campaignid": campaignID
                        }
                    },
                    "address_data": {
                        "is_primary": "true",
                        "address1": "1122 Boogie Boogie Ave.",
                        "address2": "",
                        "city": "Anaheim",
                        "subnational": "CA",
                        "postal_code": "92801",
                        "country": "USA",
                        "email": excludeEmail ? "" : "jack_skellington@scareme.com",
                        "phone_number": excludePhoneNumber ? "" : "7141122222",
                        "first_name": "Jack",
                        "last_name": "Skelington"
                    },
                    "card_data": {
                        "name_on_card": "Jack Skelington",
                        "pan": "4114411441144114",
                        "cvv": excludeCVV ? "" : "414",
                        "expiration_month": "04",
                        "expiration_year": "24"
                    }
                };
            } else if (character === 'pepper_potts') {
                data = {
                    "cardholder_data": {
                        "email": "pepper_potts@starkindustries.com",
                        "type": "ephemeral",
                        "custom_data": {
                            "campaignid": campaignID
                        }
                    },
                    "address_data": {
                        "is_primary": "true",
                        "address1": "10880 Malibu Point",
                        "address2": "",
                        "city": "Malibu",
                        "subnational": "CA",
                        "postal_code": "90265",
                        "country": "USA",
                        "email": excludeEmail ? "" : "pepper_potts@starkindustries.com",
                        "phone_number": excludePhoneNumber ? "" : "3105550187",
                        "first_name": "Pepper",
                        "last_name": "Potts"
                    },
                    "card_data": {
                        "name_on_card": "Pepper Potts",
                        "pan": "5555555555554444",
                        "cvv": excludeCVV ? "" : "123",
                        "expiration_month": "08",
                        "expiration_year": "26"
                    }
                };
            }

            const url = 'https://bswpcoqak3b7elcynskytiapyu0eokxs.lambda-url.us-west-2.on.aws/';
            
            fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('HTTP error');
                }
                return response.json();
            })
            .then(apiResponse => {
                ssoGrant = apiResponse.grant;
                ssoCardID = apiResponse.cardId;
                callback(apiResponse); 
            })
            .catch(error => {
                console.error('Error:', error);
            });
        }

        document.getElementById('placeCardsButton').addEventListener('click', function() {
            document.getElementById('placeCardsButton').addEventListener('click', function() {
                const character = document.getElementById('characterSelect').value;
                
                // attempting to clear this so that old SSO and grants aren't saved.
                sessionStorage.clear();

                // Check if the user selected "No Card"
                if (character === 'no_card') {
                    // Directly call embedCardUpdatr with empty grant and card_id
                    window.embedCardUpdatr({
                        "config": {
                            "show_close_overlay_button" : true,
                            "overlay" : "true",
                            "app_container_id": "cardupdatr-frame",
                            "show_header": "false",
                            "hostname": "https://argfcu.customer-dev.cardupdatr.app/",
                            "top_sites": "",
                            "merchant_site_tags": "demo"
                        },
                        "user": {
                            "grant": "", // Set grant to empty
                            "card_id": "", // Set card_id to empty
                        },
                        "style": {
                            "overlay_background_color" : "rgba(0,0,0,.60)"
                        }
                    });
                } else {
                    // If any other character is selected, proceed with calling the API gateway
                    callApiGateway(function(apiResponse) {
                        console.log("Callback executed with API Response:", apiResponse);

                        window.embedCardUpdatr({
                            "config": {
                                "show_close_overlay_button" : true,
                                "overlay" : "true",
                                "app_container_id": "cardupdatr-frame",
                                "show_header": "false",
                                "hostname": "https://argfcu.customer-dev.cardupdatr.app/",
                                "top_sites": "",
                                "merchant_site_tags": "demo"
                            },
                            "user": {
                                "grant": ssoGrant,
                                "card_id": ssoCardID,
                            },
                            "style": {
                            }
                        });
                    });
                }
            });
        });

    </script>
</body>
</html>
